# ==============================================================================
# Matterport Defurnishing Pipeline Configuration
# ==============================================================================

pipeline:
  hf_key: ""                      # Hugging Face API key / token for downloading models (or set HF_TOKEN env var)
  log_level: "INFO"               # DEBUG, INFO, WARNING, ERROR
  stage: "all"                    # all, masks-only, inpaint-only
  projection: "cubemap"           # cubemap, equirectangular
  recursive: false                # Recursively search input directories
  overwrite: false                # Overwrite existing outputs

# --- SAM 3.1 Mask Generator Settings ---
sam:
  model_path: "facebook/sam3.1"
  device: "cuda"
  dtype: "bfloat16"               # bfloat16, float16, float32
  threshold: 0.40                 # Detection confidence cutoff
  mask_dilate: 15                 # Pixels to dilate mask to cover contact shadows
  prompts:
    - "sofa"
    - "couch"
    - "chair"
    - "armchair"
    - "table"
    - "coffee table"
    - "bed"
    - "nightstand"
    - "desk"
    - "cabinet"
    - "wardrobe"
    - "bookshelf"
    - "tv stand"
    - "dresser"
    - "rug"
    - "lamp"
    - "television"
    - "mirror"
    - "picture frame"
    - "curtain"
    - "luggage rack"
    - "trash can"
    - "telephone"
    - "sconce"
    - "pillow"
    - "kettle"
    - "tray"
    - "bottle"
    - "book"
    - "flyers"
    - "bookshelf"
    - "bucket"
    - "dustbin"
    - "tray"
    - "cups"
    - "mugs"
    - "spoons"
    - "forks"
    - "knives"
    - "glasses"
    - "towel"
    - "fan"
    - "air conditioner"
    - "AC"
    - "ceiling fan"
    - "headboard"
    - "bed frame"
  skip_prompts: []                # Prompts to save individually but exclude from final union mask

# --- Stable Diffusion Inpainting Settings ---
sd:
  model_path: "stable-diffusion-v1-5/stable-diffusion-inpainting"
  device: "cuda"
  dtype: "float16"                # float16, bfloat16, float32
  scheduler: "dpm++"              # dpm++, euler_a, pndm, ddim
  steps: 25                       # Denoising steps (20-25 for dpm++)
  guidance_scale: 7.5
  strength: 1.0
  seed: 1234
  attention_slicing: false        # Enable to cut VRAM on consumer GPUs
  prompt: "completely empty vacant room interior, continuous clean bare floor, seamless bare flooring, empty walls, clean room corners and baseboards, raw architectural shell, realistic interior architecture photography, 8k, sharp focus"
  negative_prompt: "furniture, bed, mattress, headboard, bedding, pillows, bathtub, boat, sofa, couch, chair, bench, table, desk, nightstand, cabinet, wardrobe, rug, carpet, mat, decor, lamp, appliances, clutter, shadows of removed objects, floating objects, platform, steps, altered architecture, distorted perspective, blurry, artifacts, lowres, watermark"

# --- Cubemap Perspective Settings ---
cubemap:
  face_size: 512                  # Working resolution per square cube face (e.g. 512, 768, 1024)

# --- Geometry & Pre/Post-Processing ---
geometry:
  roll: true                      # Circular horizontal roll to center furniture
  pad: true                       # Circular wrap-padding at 0°/360° seams
  pad_ratio: 0.20                 # Fraction of width to pad on each side
  target_height: 256              # Inpaint working height (aspect preserved, width mult of 8)
  blend_feather: 6                # Pixel radius for boundary alpha feathering
  output_format: "jpg"            # jpg or png
  jpeg_quality: 95                # JPEG output quality (1-100)
